<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>チェックリスト</title>
<meta name="description" content="業務用チェックリスト（端末内保存・オフライン動作）">
<meta name="theme-color" content="#f4f6f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="チェックリスト">
<style>
/* ---------- 配色（既定＝ダーク。端末がライトならライトへ切り替わる） ---------- */
:root{
  --bg:#0d1117; --card:#161d26; --card2:#202b36; --line:#333f4c; --press:#2b3846;
  --fg:#f2f6fa; --muted:#93a6b8; --field:#080b0f;
  --ok:#ff7a2f; --ok-bg:#3a1e0c; --ok-line:#ff7a2f; --on-ok:#2a1002;
  --skip:#94a6b8; --skip-bg:#1d242c; --skip-line:#4b5a68;
  --accent:#ff7a2f; --primary-bg:#4a2410; --primary-fg:#ffd6bb;
  --danger:#ff8f8f; --danger-bg:#3d1717; --danger-line:#7d3030;
  --bar-bg:rgba(13,17,23,.97);
  --toast-bg:#eef4fb; --toast-fg:#0d1117; --toast-link:#c2510c;
  --shadow:0 8px 24px rgba(0,0,0,.5);
  --bar-h:60px; --radius:12px;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#f4f6f9; --card:#ffffff; --card2:#e9eef4; --line:#ccd6e0; --press:#dbe3ec;
    --fg:#101820; --muted:#5b6b7b; --field:#ffffff;
    --ok:#e2621b; --ok-bg:#fdeee3; --ok-line:#e2621b; --on-ok:#ffffff;
    --skip:#5b6b7b; --skip-bg:#eaeef3; --skip-line:#b6c2ce;
    --accent:#d95a11; --primary-bg:#fde7d7; --primary-fg:#8d3907;
    --danger:#a12222; --danger-bg:#fdecec; --danger-line:#e0a3a3;
    --bar-bg:rgba(244,246,249,.97);
    --toast-bg:#1b2430; --toast-fg:#f2f6fa; --toast-link:#ffa46a;
    --shadow:0 8px 24px rgba(16,24,32,.18);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--fg);
  font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
  font-size:15px; line-height:1.4;
  -webkit-text-size-adjust:100%;
  overscroll-behavior-y:contain;
  padding-bottom:calc(var(--bar-h) + env(safe-area-inset-bottom));
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}

/* ---------- ヘッダー ---------- */
#hdr{
  position:sticky; top:0; z-index:20; background:var(--bg);
  padding:calc(8px + env(safe-area-inset-top)) 12px 8px;
}
.h-row{display:flex; align-items:baseline; gap:8px}
.h-title{font-size:18px; font-weight:700; margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.h-title .dot{color:var(--accent)}
.h-sub{font-size:12px; color:var(--muted); margin-top:5px}
.h-count{margin-left:auto; font-size:17px; font-weight:800; font-variant-numeric:tabular-nums; color:var(--muted)}
.h-count.done{color:var(--ok)}

/* ---------- プログレスバー ---------- */
.track{height:6px; border-radius:99px; background:var(--card2); border:1px solid var(--line); overflow:hidden; margin-top:8px; display:flex}
.fill{height:100%; background:var(--ok); width:0%; transition:width .16s ease}
.fill.skip{background:var(--skip)}

/* ---------- 本体 ---------- */
main{padding:4px 10px 16px; max-width:640px; margin:0 auto}
.stack{display:flex; flex-direction:column; gap:8px}
.stack.grow{min-height:calc(100dvh - var(--hdr-h,84px) - var(--bar-h) - env(safe-area-inset-bottom) - 20px); justify-content:center}

/* ---------- コンテキスト選択のボタン ---------- */
.ctx-btn{
  display:block; width:100%; text-align:left;
  background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:14px 14px 12px; color:var(--fg);
}
.ctx-btn:active{background:var(--card2)}
.ctx-btn.done{border-color:var(--ok-line); background:var(--ok-bg)}
.ctx-btn .top{display:flex; align-items:center; gap:10px}
.ctx-btn .name{font-size:19px; font-weight:700}
.ctx-btn .frac{margin-left:auto; font-size:19px; font-weight:800; font-variant-numeric:tabular-nums; color:var(--muted)}
.ctx-btn.done .frac{color:var(--ok)}
.ctx-btn .times{margin-top:7px; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums}

/* ---------- チェック項目 ---------- */
.item{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  min-height:52px; padding:8px 10px;
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  color:var(--fg);
}
.item:active{background:var(--card2)}
.item.on{background:var(--ok-bg); border-color:var(--ok-line)}
.item.skipped{background:var(--skip-bg); border-color:var(--skip-line)}
.box{
  flex:0 0 auto; width:26px; height:26px; border-radius:7px;
  border:2px solid var(--muted); background:transparent;
  display:grid; place-items:center; position:relative;
}
.item.on .box{border-color:var(--ok); background:var(--ok)}
.item.skipped .box{border-color:var(--skip); background:transparent}
.item.skipped .box::after{
  content:""; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  width:13px; height:3px; background:var(--skip); border-radius:2px;
}
.box svg{width:18px; height:18px; stroke:var(--on-ok); stroke-width:3.6; fill:none; stroke-linecap:round; stroke-linejoin:round; opacity:0}
.item.on .box svg{opacity:1}
.item .txt{flex:1; min-width:0; font-size:16px; font-weight:600; line-height:1.3; word-break:break-word}
.item.on .txt{opacity:.8}
.item.skipped .txt{opacity:.6; text-decoration:line-through}
.item .at{flex:0 0 auto; font-size:12px; color:var(--ok); font-weight:700; font-variant-numeric:tabular-nums}
.item.skipped .at{color:var(--skip)}
.skipbtn{
  flex:0 0 auto; padding:6px 9px; border-radius:9px; font-size:11px; font-weight:800;
  background:transparent; border:1px solid var(--line); color:var(--muted); line-height:1;
}
.skipbtn:active{background:var(--card2)}
.item.skipped .skipbtn{border-color:var(--skip-line); color:var(--skip)}

.empty{color:var(--muted); text-align:center; padding:32px 10px; font-size:14px; line-height:1.7}
.mode-note{font-size:12px; color:var(--muted); padding:2px 2px 6px}

/* ---------- 下部の操作バー ---------- */
#bar{
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  display:flex; gap:8px; padding:7px 10px calc(7px + env(safe-area-inset-bottom));
  background:var(--bar-bg); border-top:1px solid var(--line);
  backdrop-filter:blur(6px);
}
#bar .btn{flex:1}
.btn{
  min-height:44px; padding:8px 10px; border-radius:11px;
  background:var(--card2); border:1px solid var(--line); color:var(--fg);
  font-size:15px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:6px;
  white-space:nowrap;
}
.btn:active{background:var(--press)}
.btn.primary{background:var(--primary-bg); border-color:var(--accent); color:var(--primary-fg)}
.btn.danger{background:var(--danger-bg); border-color:var(--danger-line); color:var(--danger)}
.btn.grow2{flex:1.6}
.btn.sm{min-height:38px; font-size:13px; padding:7px 11px; border-radius:10px; flex:0 0 auto}
.btn[disabled]{opacity:.4}

/* ---------- 項目エディタ（リスト画面の編集モード / 設定画面 共通） ---------- */
.edit-card{background:var(--card2); border:1px solid var(--line); border-radius:11px; padding:7px; margin-top:7px}
.edit-card input[type=text]{
  width:100%; padding:9px 10px; font-size:15px;
  background:var(--field); color:var(--fg); border:1px solid var(--line); border-radius:9px;
}
.edit-tools{display:flex; gap:6px; justify-content:flex-end; margin-top:6px}
.iconbtn{
  flex:0 0 auto; width:38px; height:38px; border-radius:9px;
  background:var(--card); border:1px solid var(--line); color:var(--fg);
  font-size:15px; font-weight:800; display:grid; place-items:center;
}
.iconbtn:active{background:var(--press)}
.iconbtn.del{color:var(--danger); border-color:var(--danger-line)}
.iconbtn[disabled]{opacity:.28}
.row-actions{display:flex; gap:8px; margin-top:8px; flex-wrap:wrap}

/* ---------- 設定画面 ---------- */
.sec{background:var(--card); border:1px solid var(--line); border-radius:13px; padding:12px; margin-bottom:10px}
.sec h2{margin:0 0 3px; font-size:16px; font-weight:700}
.sec .hint{margin:0 0 10px; font-size:12px; color:var(--muted); line-height:1.5}
.name-input{
  width:100%; padding:10px 12px; font-size:16px; font-weight:700;
  background:var(--field); color:var(--fg); border:1px solid var(--line); border-radius:10px;
}
.kv{display:flex; justify-content:space-between; gap:12px; font-size:13px; color:var(--muted); padding:5px 0}
.kv b{color:var(--fg); font-weight:700}

/* ---------- モーダル / トースト ---------- */
#modal{position:fixed; inset:0; z-index:60; display:grid; place-items:center; padding:16px; background:rgba(0,0,0,.6)}
#modal[hidden]{display:none}
.sheet{width:100%; max-width:400px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; box-shadow:var(--shadow)}
.sheet h3{margin:0 0 6px; font-size:17px; font-weight:700}
.sheet p{margin:0 0 14px; font-size:14px; color:var(--muted); line-height:1.55; white-space:pre-wrap}
.sheet .acts{display:flex; gap:8px}
.sheet .acts .btn{flex:1}
/* リマインダーの通知帯 */
#alert{
  position:fixed; left:8px; right:8px; z-index:65;
  bottom:calc(var(--bar-h) + 10px + env(safe-area-inset-bottom));
  background:var(--accent); color:#fff; border-radius:14px; padding:12px;
  box-shadow:var(--shadow); display:flex; flex-direction:column; gap:9px;
}
#alert[hidden]{display:none}
.alert-title{font-size:13px; font-weight:800; opacity:.9}
.alert-body{font-size:15px; font-weight:700; line-height:1.5; font-variant-numeric:tabular-nums}
.alert-ctx{font-size:11px; font-weight:700; opacity:.85; margin-left:8px;
  border:1px solid rgba(255,255,255,.55); border-radius:6px; padding:1px 5px}
.alert-acts{display:flex; gap:8px}
.alert-acts .btn{flex:1; min-height:40px; font-size:14px;
  background:rgba(255,255,255,.18); border-color:rgba(255,255,255,.6); color:#fff}
.alert-acts .btn:active{background:rgba(255,255,255,.3)}

/* 行に出すリマインド時刻 */
.chip{
  flex:0 0 auto; font-size:11px; font-weight:800; padding:4px 6px; border-radius:8px;
  color:var(--muted); border:1px solid var(--line); font-variant-numeric:tabular-nums;
}
.chip.due{color:#fff; background:var(--accent); border-color:var(--accent)}

/* 編集画面の時刻入力 */
.remind-row{display:flex; align-items:center; gap:6px; margin-right:auto}
.remind-row input[type=time]{
  padding:7px 8px; font-size:14px; font-variant-numeric:tabular-nums;
  background:var(--field); color:var(--fg); border:1px solid var(--line); border-radius:9px;
}
.remind-row .lbl{font-size:14px; color:var(--muted)}

#toast{
  position:fixed; left:50%; transform:translateX(-50%);
  bottom:calc(var(--bar-h) + 14px + env(safe-area-inset-bottom)); z-index:70;
  background:var(--toast-bg); color:var(--toast-fg); font-weight:700; font-size:14px;
  padding:10px 15px; border-radius:99px; box-shadow:var(--shadow);
  max-width:88vw; text-align:center; display:none;
}
#toast.show{display:block}
#toast button{background:none;border:0;color:var(--toast-link);font-weight:800;text-decoration:underline;padding:0 0 0 10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header id="hdr"></header>
<main id="main"></main>
<nav id="bar"></nav>
<div id="modal" hidden></div>
<div id="alert" role="alert" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:20px">このアプリはJavaScriptが必要です。</p></noscript>
<script>
(() => {
'use strict';

/* =========================================================
   設定値
   ========================================================= */
const STORE_KEY     = 'deliveryChecklist.v1';
const DAY_START_HOUR = 4;   // 業務日の区切り（午前4時）。4時までは前日扱い。
const KEEP_DAYS      = 60;  // チェック履歴の保持日数

/* =========================================================
   初期データ（仮。設定画面から自由に差し替えてください）
   ========================================================= */
function defaultData() {
  const mk = (name, items) => ({ id: uid(), name, items: items.map(t => ({ id: uid(), text: t })) });
  return {
    version: 4,
    settings: { keepAwake: true, sound: true, soundStyle: 'unlock', remind: true },
    contexts: [
      mk('出発前', [
        '納品書・伝票を持ったか',
        '商品の数量を照合した',
        '台車・カゴを積んだ',
        '保冷剤・カバーを用意した',
        '端末の充電残量を確認した',
        '車の鍵・免許証',
        '本日のルートを確認した',
      ]),
      mk('店を出る前', [
        '検品印・サインをもらった',
        '空カゴ・返却品を回収した',
        '返品・欠品を記録した',
        '冷蔵ケースの扉を閉めた',
        '店内に忘れ物がないか見た',
        '次の店へ到着連絡をした',
      ]),
      mk('戻った後', [
        '空カゴ・備品を所定位置へ戻した',
        '返品を仕分けて棚に戻した',
        '伝票を提出した（写真も保存）',
        '台車と保冷剤を片付けた',
        '端末を充電器に挿した',
        '明日の指示を確認した',
      ]),
    ],
    // log[業務日][コンテキストID][項目ID] = { at: 時刻(epoch ms), skip: true(スキップの場合) }
    log: {},
    // notified[業務日][項目ID] = リマインドを出した時刻。1日1回だけ出すための記録
    notified: {},
  };
}

/* =========================================================
   小道具
   ========================================================= */
const $ = (sel, el = document) => el.querySelector(sel);
const hdr = $('#hdr'), main = $('#main'), bar = $('#bar');

function uid() {
  if (crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function pad2(n) { return String(n).padStart(2, '0'); }
function hhmm(ms) { const d = new Date(ms); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }

/* ---- 業務日（午前4時区切り） ---- */
function businessDateKey(d = new Date()) {
  const t = new Date(d.getTime() - DAY_START_HOUR * 3600000);
  return t.getFullYear() + '-' + pad2(t.getMonth() + 1) + '-' + pad2(t.getDate());
}
const WD = ['日','月','火','水','木','金','土'];
function dateLabel(key) {
  const [y, m, d] = key.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  return `${m}/${d}(${WD[dt.getDay()]})`;
}
function daysBetween(aKey, bKey) {
  const p = k => { const [y,m,d] = k.split('-').map(Number); return Date.UTC(y, m-1, d); };
  return Math.round((p(aKey) - p(bKey)) / 86400000);
}

/* =========================================================
   保存 / 読み込み
   ========================================================= */
let state = null;
let today = businessDateKey();

/* version 1・2 では "contexts" ではなく "scenes" という名前だった */
function contextsOf(o) {
  return Array.isArray(o.contexts) ? o.contexts : (Array.isArray(o.scenes) ? o.scenes : null);
}
function isValidData(o) {
  if (!o || typeof o !== 'object') return false;
  const cs = contextsOf(o);
  return !!cs
    && cs.every(c => c && typeof c.name === 'string' && Array.isArray(c.items))
    && !!o.log && typeof o.log === 'object' && !Array.isArray(o.log);
}

function normalize(o) {
  const d = {
    version: 4,
    settings: Object.assign({ keepAwake: true, sound: true, soundStyle: 'unlock', remind: true }, o.settings || {}),
    contexts: contextsOf(o).map(s => ({
      id: s.id || uid(),
      name: String(s.name),
      items: (s.items || [])
        .filter(it => it && typeof it.text === 'string')
        .map(it => {
          const item = { id: it.id || uid(), text: String(it.text) };
          if (typeof it.remind === 'string' && /^\d{1,2}:\d{2}$/.test(it.remind)) item.remind = it.remind;
          return item;
        }),
    })),
    log: {},
    notified: {},
  };
  for (const [day, contexts] of Object.entries(o.log || {})) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(day) || !contexts || typeof contexts !== 'object') continue;
    const dd = {};
    for (const [sid, items] of Object.entries(contexts)) {
      if (!items || typeof items !== 'object') continue;
      const ii = {};
      for (const [iid, v] of Object.entries(items)) {
        // v1 は数値（チェックした時刻）だけだった。v2 は { at, skip }。
        const at = Number(typeof v === 'object' && v ? v.at : v);
        if (!Number.isFinite(at) || at <= 0) continue;
        const e = { at };
        if (typeof v === 'object' && v && v.skip) e.skip = true;
        ii[iid] = e;
      }
      if (Object.keys(ii).length) dd[sid] = ii;
    }
    if (Object.keys(dd).length) d.log[day] = dd;
  }
  for (const [day, ids] of Object.entries(o.notified || {})) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(day) || !ids || typeof ids !== 'object') continue;
    d.notified[day] = {};
    for (const [iid, at] of Object.entries(ids)) {
      const n = Number(at);
      if (Number.isFinite(n) && n > 0) d.notified[day][iid] = n;
    }
  }
  return d;
}

function load() {
  let raw = null;
  try { raw = localStorage.getItem(STORE_KEY); } catch (e) { /* プライベートモード等 */ }
  if (!raw) return defaultData();
  try {
    const o = JSON.parse(raw);
    return isValidData(o) ? normalize(o) : defaultData();
  } catch (e) {
    console.warn('保存データを読めませんでした', e);
    return defaultData();
  }
}

let saveTimer = null;
function save(now = false) {
  const write = () => {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
    } catch (e) {
      toast('保存できませんでした（端末の空き容量を確認してください）');
      console.error(e);
    }
  };
  if (now) { clearTimeout(saveTimer); write(); return; }
  clearTimeout(saveTimer);
  saveTimer = setTimeout(write, 250);
}
// 画面を閉じる直前に確実に書き込む
addEventListener('pagehide', () => save(true));
addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') save(true); });

/* 古い履歴を削除（KEEP_DAYS日より前） */
function pruneLog() {
  let removed = 0;
  for (const day of Object.keys(state.log)) {
    if (daysBetween(today, day) >= KEEP_DAYS) { delete state.log[day]; removed++; }
  }
  for (const day of Object.keys(state.notified || {})) {
    if (daysBetween(today, day) >= KEEP_DAYS) delete state.notified[day];
  }
  return removed;
}

/* =========================================================
   チェック状態
   ========================================================= */
function dayLog(day = today) {
  if (!state.log[day]) state.log[day] = {};
  return state.log[day];
}
function ctxLog(ctxId, day = today) {
  const dl = dayLog(day);
  if (!dl[ctxId]) dl[ctxId] = {};
  return dl[ctxId];
}
/* 1項目の状態は次の3つ。entry が無ければ「未」。
   { at }             … チェック済み
   { at, skip:true }  … スキップ                                        */
function entryOf(ctxId, itemId) {
  const d = state.log[today];
  return (d && d[ctxId] && d[ctxId][itemId]) || null;
}
function isChecked(ctxId, itemId) { const e = entryOf(ctxId, itemId); return !!e && !e.skip; }
function isSkipped(ctxId, itemId) { const e = entryOf(ctxId, itemId); return !!e && !!e.skip; }
function checkedAt(ctxId, itemId) { const e = entryOf(ctxId, itemId); return e ? e.at : 0; }

function toggleItem(ctxId, itemId) {
  const sl = ctxLog(ctxId);
  const e = sl[itemId];
  if (e && !e.skip) delete sl[itemId];       // チェック済み → 未
  else sl[itemId] = { at: Date.now() };      // 未・スキップ → チェック済み
  save();
}
function toggleSkip(ctxId, itemId) {
  const sl = ctxLog(ctxId);
  const e = sl[itemId];
  if (e && e.skip) delete sl[itemId];                  // スキップ → 未
  else sl[itemId] = { at: Date.now(), skip: true };    // 未・チェック済み → スキップ
  save();
}

function progress(ctx) {
  const total = ctx.items.length;
  let done = 0, skipped = 0;
  for (const it of ctx.items) {
    if (isChecked(ctx.id, it.id)) done++;
    else if (isSkipped(ctx.id, it.id)) skipped++;
  }
  const handled = done + skipped;   // 「もう触らなくていい」件数
  return {
    done, skipped, handled, total,
    pct: total ? Math.round(done / total * 100) : 0,
    skipPct: total ? Math.round(skipped / total * 100) : 0,
    all: total > 0 && handled === total,
  };
}
function ctxTimes(ctx) {
  const ts = ctx.items.map(it => checkedAt(ctx.id, it.id)).filter(Boolean).sort((a, b) => a - b);
  if (!ts.length) return null;
  const first = ts[0], last = ts[ts.length - 1];
  const min = Math.round((last - first) / 60000);
  return { first, last, min, n: ts.length };
}
function findCtx(id) { return state.contexts.find(s => s.id === id) || null; }

let toastTimer = null;

  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), ms);
}

function confirmDialog({ title, body = '', ok = 'OK', cancel = 'やめる', danger = false }) {
  return new Promise(resolve => {
    const m = $('#modal');
    m.innerHTML = `
      <div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
        <h3>${esc(title)}</h3>
        ${body ? `<p>${esc(body)}</p>` : ''}
        <div class="acts">
          <button class="btn" data-a="cancel">${esc(cancel)}</button>
          <button class="btn ${danger ? 'danger' : 'primary'}" data-a="ok">${esc(ok)}</button>
        </div>
      </div>`;
    m.hidden = false;
    const done = v => { m.hidden = true; m.innerHTML = ''; document.removeEventListener('keydown', onKey); resolve(v); };
    const onKey = e => { if (e.key === 'Escape') done(false); };
    document.addEventListener('keydown', onKey);
    m.onclick = e => {
      const b = e.target.closest('[data-a]');
      if (b) return done(b.dataset.a === 'ok');
      if (e.target === m) done(false);
    };
    setTimeout(() => { const b = m.querySelector('[data-a="ok"]'); if (b) b.focus(); }, 0);
  });
}

/* =========================================================
   効果音
   音声ファイルは持たず、その場で合成する（オフラインでも鳴る）
   ========================================================= */
let audioCtx = null;
let reverbIR = null;

/* 画面に一度も触れていない状態での振動はブラウザに拒否される（起動直後のリマインド等） */
function buzz(pattern) {
  try {
    if (!navigator.vibrate) return;
    if (navigator.userActivation && !navigator.userActivation.hasBeenActive) return;
    navigator.vibrate(pattern);
  } catch (e) { /* 無視 */ }
}

function ensureAudio() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  if (!audioCtx) audioCtx = new AC();
  if (audioCtx.state === 'suspended') { const r = audioCtx.resume(); if (r && r.catch) r.catch(() => {}); }
  return audioCtx;
}

/* 金属的な余韻を作るための短い残響（1回だけ生成して使い回す） */
function getReverb(ac) {
  if (reverbIR) return reverbIR;
  const len = Math.floor(ac.sampleRate * 1.1);
  const buf = ac.createBuffer(2, len, ac.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch);
    for (let i = 0; i < len; i++) {
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2);
    }
  }
  const conv = ac.createConvolver();
  conv.buffer = buf;
  reverbIR = conv;
  return conv;
}

/* ベルの音色（基音＋わずかにずらした倍音。上の倍音ほど速く減衰する） */
function bell(ac, out, freq, start, dur, peak) {
  const PARTIALS = [[1, 1], [2.01, 0.42], [3.01, 0.22], [4.07, 0.11], [5.43, 0.06]];
  const t0 = ac.currentTime + start;
  PARTIALS.forEach(([mul, amp], i) => {
    const osc = ac.createOscillator();
    const g = ac.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq * mul, t0);
    const life = dur * Math.pow(0.62, i);   // 上の倍音ほど短く消える
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak * amp, t0 + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + life);
    osc.connect(g); g.connect(out);
    osc.start(t0);
    osc.stop(t0 + life + 0.03);
  });
}

/* notes: [周波数, 開始秒, 長さ秒, 音量] の配列を鳴らす */
function playBells(notes, volume) {
  const ac = ensureAudio();
  if (!ac) return;
  try {
    const master = ac.createGain();
    master.gain.value = volume;
    master.connect(ac.destination);
    // 少しだけ残響を混ぜて「解除された」感を出す
    const wet = ac.createGain();
    wet.gain.value = 0.32;
    wet.connect(master);
    getReverb(ac).connect(wet);
    const dry = ac.createGain();
    dry.gain.value = 1;
    dry.connect(master);
    const bus = ac.createGain();
    bus.connect(dry);
    bus.connect(getReverb(ac));
    for (const [f, t, d, p] of notes) bell(ac, bus, f, t, d, p);
  } catch (e) { /* 音が出せない環境は黙って無視 */ }
}

/* =========================================================
   リマインダー
   アプリを開いている間に、指定時刻を過ぎた未処理の項目を知らせる
   ========================================================= */

/* 業務日 dayKey における、その項目のリマインド時刻（epoch ms）。未設定なら0 */
function remindTs(item, dayKey = today) {
  if (!item.remind) return 0;
  const m = /^(\d{1,2}):(\d{2})$/.exec(item.remind);
  if (!m) return 0;
  const [y, mo, d] = dayKey.split('-').map(Number);
  const h = Number(m[1]), mi = Number(m[2]);
  const dt = new Date(y, mo - 1, d, h, mi, 0, 0);
  // 午前4時より前の時刻は、業務日としては翌日の未明にあたる
  if (h < DAY_START_HOUR) dt.setDate(dt.getDate() + 1);
  return dt.getTime();
}
function isOverdue(ctx, item) {
  const ts = remindTs(item);
  return !!ts && Date.now() >= ts && !isChecked(ctx.id, item.id) && !isSkipped(ctx.id, item.id);
}

let alertQueue = [];
function checkReminders() {
  if (!state.settings.remind) return;
  if (!state.notified) state.notified = {};
  const nd = state.notified[today] || (state.notified[today] = {});
  const due = [];
  for (const c of state.contexts) {
    for (const it of c.items) {
      if (nd[it.id]) continue;
      if (!isOverdue(c, it)) continue;
      nd[it.id] = Date.now();
      due.push({ ctxId: c.id, ctxName: c.name, text: it.text, at: it.remind });
    }
  }
  if (!due.length) return;
  save(true);
  alertQueue = due;
  showAlert(due);
  playReminderSound();
  buzz([180, 90, 180]);
  notifyOS(due);
  if (route().view === 'ctx') render(false);   // 行の表示も更新する
}

function showAlert(due) {
  const el = $('#alert');
  const lines = due.map(d => `${esc(d.at)}　${esc(d.text)}<span class="alert-ctx">${esc(d.ctxName)}</span>`).join('<br>');
  el.innerHTML = `
    <div class="alert-title">⏰ 時間になりました</div>
    <div class="alert-body">${lines}</div>
    <div class="alert-acts">
      <button class="btn" data-act="alert-close">閉じる</button>
      <button class="btn" data-act="alert-open" data-ctx="${esc(due[0].ctxId)}">開く</button>
    </div>`;
  el.hidden = false;
}
function hideAlert() { const el = $('#alert'); el.hidden = true; el.innerHTML = ''; alertQueue = []; }

/* 端末の通知（許可されているときだけ。アプリを閉じていると出ないことがある） */
function notifyOS(due) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const title = '⏰ ' + due[0].text;
  const body = due.length > 1
    ? `${due[0].ctxName} ほか ${due.length}件`
    : `${due[0].ctxName}　${due[0].at}`;
  const opts = { body, tag: 'checklist-remind', renotify: true, icon: './icons/icon-192.png', badge: './icons/icon-192.png' };
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.ready) {
      navigator.serviceWorker.ready.then(reg => reg.showNotification(title, opts)).catch(() => {});
    } else {
      new Notification(title, opts);
    }
  } catch (e) { /* 通知が使えない環境は無視 */ }
}

async function askNotifyPermission() {
  if (!('Notification' in window)) { toast('この端末は通知に対応していません'); return; }
  if (Notification.permission === 'granted') { toast('通知はすでに許可されています'); return; }
  if (Notification.permission === 'denied') {
    toast('ブラウザの設定で通知がブロックされています', 4200);
    return;
  }
  const r = await Notification.requestPermission();
  toast(r === 'granted' ? '通知を許可しました' : '通知は許可されませんでした');
  rerender();
}

/* =========================================================
   画面スリープ防止（Wake Lock API）
   ========================================================= */
let wakeLock = null;
async function acquireWakeLock() {
  if (!state.settings.keepAwake) return;
  if (!('wakeLock' in navigator)) return;
  if (wakeLock) return;
  if (document.visibilityState !== 'visible') return;
  try {
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => { wakeLock = null; });
  } catch (e) { /* 電池セーバー中などは失敗する。無視して良い */ }
}
async function releaseWakeLock() {
  try { if (wakeLock) await wakeLock.release(); } catch (e) {}
  wakeLock = null;
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { if (!checkDayRollover()) checkReminders(); acquireWakeLock(); }
});

function route() {
  const h = location.hash || '#/';
  if (h.startsWith('#/ctx/')) return { view: 'ctx', id: decodeURIComponent(h.slice('#/ctx/'.length)) };
  if (h === '#/settings') return { view: 'settings' };
  return { view: 'home' };
}
const go = h => { location.hash = h; };
addEventListener('hashchange', () => { checkDayRollover(); render(); });

const CHECK_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="4.5,12.5 10,18 19.5,6.5"/></svg>';

let editMode = false;   // チェックリスト画面の「編集」モード

function render(resetScroll = true) {
  const r = route();
  if (r.view === 'ctx' && !findCtx(r.id)) { go('#/'); return; }
  if (r.view !== 'ctx') editMode = false;
  if (r.view === 'ctx') renderCtx(findCtx(r.id));
  else if (r.view === 'settings') renderSettings();
  else renderHome();
  if (resetScroll) document.documentElement.scrollTop = 0;
}
/* スクロール位置を保ったまま今の画面を作り直す */
function rerender() {
  const y = window.scrollY;
  render(false);
  window.scrollTo(0, y);
}

      </div>
      <div class="kv" style="margin-top:10px"><span>コンテキスト</span><b>${state.contexts.length}件</b></div>
      <div class="kv"><span>チェック項目</span><b>${items}件</b></div>
      <div class="kv"><span>記録が残っている日数</span><b>${days}日分</b></div>
    </section>

    <section class="sec">
      <h2>音</h2>
      <p class="hint">チェックを入れたときに短い音が鳴ります（外すときとスキップは鳴りません）。
端末のメディア音量が0だと鳴りません。</p>
      <div class="row-actions">
        <button class="btn sm ${state.settings.sound ? 'primary' : ''}" data-act="sound">
          ${state.settings.sound ? '✓ 音を鳴らす（オン）' : '音を鳴らす（オフ）'}
        </button>
      </div>
      <p class="hint" style="margin:12px 0 0">音の種類（押すと試せます）</p>
      <div class="row-actions">
        <button class="btn sm ${state.settings.soundStyle !== 'pico' ? 'primary' : ''}" data-act="style" data-style="unlock">
          ${state.settings.soundStyle !== 'pico' ? '✓ ' : ''}実績解除ふう
        </button>
        <button class="btn sm ${state.settings.soundStyle === 'pico' ? 'primary' : ''}" data-act="style" data-style="pico">
          ${state.settings.soundStyle === 'pico' ? '✓ ' : ''}ピコン
        </button>
      </div>
    </section>

    <section class="sec">
      <h2>リマインダー</h2>
      <p class="hint">項目ごとに時刻を決めておくと、その時刻を過ぎてもチェックもスキップもされていない項目を知らせます。
時刻は「✎ 編集」または上のコンテキストの編集欄で、項目ごとに ⏰ から設定します。</p>
      <div class="row-actions">
        <button class="btn sm ${state.settings.remind ? 'primary' : ''}" data-act="remind">
          ${state.settings.remind ? '✓ 知らせる（オン）' : '知らせる（オフ）'}
        </button>
        <button class="btn sm ${notifyState() === 'granted' ? 'primary' : ''}" data-act="notifyperm">
          ${notifyState() === 'granted' ? '✓ 端末の通知は許可済み'
            : notifyState() === 'denied' ? '端末の通知はブロック中'
            : '端末の通知を許可する'}
        </button>
      </div>
      <p class="hint" style="margin:12px 0 0">
        <b>アプリを開いている間は確実に鳴ります。</b>
        閉じている間や、他のアプリを長く使っている間は鳴らないことがあります
        （サーバーを持たない作りのため、端末の目覚まし代わりにはなりません）。
      </p>
      ${remindList()}
    </section>

    <section class="sec">
      <h2>画面スリープ</h2>
      <p class="hint">オンにすると、このアプリを開いている間は画面が消えません（Wake Lock）。
端末の電池セーバー中は効かないことがあります。</p>
      <div class="row-actions">
        <button class="btn sm ${state.settings.keepAwake ? 'primary' : ''}" data-act="keepawake">
          ${state.settings.keepAwake ? '✓ スリープしない（オン）' : 'スリープしない（オフ）'}
        </button>
      </div>
    </section>

    <section class="sec">
      <h2>このアプリについて</h2>
      <div class="kv"><span>データの保存先</span><b>この端末の中だけ</b></div>
      <div class="kv"><span>日付の区切り</span><b>午前${DAY_START_HOUR}時</b></div>
      <div class="kv"><span>履歴の保持</span><b>直近${KEEP_DAYS}日</b></div>
      <div class="row-actions" style="margin-top:12px">
        <button class="btn sm danger" data-act="wipe">全データを消去</button>
      </div>
    </section>`;

  bar.innerHTML = `<button class="btn" data-act="home">← 一覧</button>`;
}

/* =========================================================
   操作
   ========================================================= */
document.addEventListener('click', async (e) => {
  const goBtn = e.target.closest('[data-go]');
  if (goBtn) { go('#/ctx/' + encodeURIComponent(goBtn.dataset.go)); return; }

  // 行の中の「スキップ」ボタン（行タップより先に処理する）
  const skipBtn = e.target.closest('.skipbtn');
  if (skipBtn) {
    const ctx = findCtx(skipBtn.dataset.ctx);
    const row = skipBtn.closest('.item');
    if (!ctx || !row) return;
    if (checkDayRollover()) return;
    toggleSkip(ctx.id, skipBtn.dataset.item);
    refreshRow(row, ctx, skipBtn.dataset.item);
    buzz(12);
    return;
  }

  const item = e.target.closest('.item');
  if (item) {
    const ctx = findCtx(item.dataset.ctx);
    if (!ctx) return;
    if (checkDayRollover()) return;           // 日付が変わっていたら作り直す
    toggleItem(ctx.id, item.dataset.item);
    refreshRow(item, ctx, item.dataset.item);
    if (isChecked(ctx.id, item.dataset.item)) playCheckSound();   // 外すときは鳴らさない
    buzz(12);
    return;
  }

  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const act = btn.dataset.act;
  const ctx = btn.dataset.ctx ? findCtx(btn.dataset.ctx) : null;

  switch (act) {
    case 'home':     go('#/'); break;
    case 'settings': go('#/settings'); break;

    case 'alert-close': hideAlert(); break;
    case 'alert-open': {
      const id = btn.dataset.ctx;
      hideAlert();
      if (id && findCtx(id)) go('#/ctx/' + encodeURIComponent(id));
      break;
    }

    case 'unremind': {
      if (!ctx) break;
      const it = ctx.items.find(x => x.id === btn.dataset.item);
      if (!it) break;
      delete it.remind;
      if (state.notified[today]) delete state.notified[today][it.id];
      save(true);
      rerender();
      break;
    }

    case 'addctx': {
      const c = { id: uid(), name: '新しいコンテキスト', items: [] };
      state.contexts.push(c);
      save(true);
      rerender();
      const el = main.querySelector(`[data-edit="ctx"][data-ctx="${CSS.escape(c.id)}"]`);
      if (el) { el.focus(); el.select(); el.scrollIntoView({ block: 'center' }); }
      break;
    }

    case 'delctx': {
      if (!ctx) break;
      const ok = await confirmDialog({
        title: `「${ctx.name}」を削除`,
        body: `このコンテキストと、その中の項目 ${ctx.items.length}件、これまでの記録をすべて消します。\nこの操作は取り消せません。`,
        ok: '削除する', danger: true,
      });
      if (!ok) break;
      state.contexts = state.contexts.filter(c => c.id !== ctx.id);
      for (const day of Object.values(state.log)) delete day[ctx.id];
      save(true);
      rerender();
      toast(`「${ctx.name}」を削除しました`);
      break;
    }

    case 'edit':     editMode = true;  render(); break;
    case 'editdone': {
      editMode = false;
      // 空のまま残った項目は保存しない
      for (const sc of state.contexts) sc.items = sc.items.filter(it => it.text.trim() !== '');
      save(true);
      render();
      break;
    }

    case 'reset': {
      if (!ctx) break;
      const p = progress(ctx);
      if (p.handled === 0) { toast('まだ記録がありません'); break; }
      const detail = p.skipped ? `チェック ${p.done}件・スキップ ${p.skipped}件` : `チェック ${p.done}件`;
      const ok = await confirmDialog({
        title: `「${ctx.name}」をリセット`,
        body: `本日の${detail} と、その時刻の記録を消します。\nこの操作は取り消せません。`,
        ok: 'リセットする', danger: true,
      });
      if (!ok) break;
      delete dayLog()[ctx.id];
      save(true);
      render(false);
      toast(`「${ctx.name}」をリセットしました`);
      break;
    }

    case 'add': {
      if (!ctx) break;
      ctx.items.push({ id: uid(), text: '' });
      save(true);
      rerender();
      const inputs = main.querySelectorAll(`[data-edit="item"][data-ctx="${CSS.escape(ctx.id)}"]`);
      const last = inputs[inputs.length - 1];
      if (last) { last.focus(); last.scrollIntoView({ block: 'center' }); }
      break;
    }

    case 'up':
    case 'down': {
      if (!ctx) break;
      const i = ctx.items.findIndex(it => it.id === btn.dataset.item);
      const j = act === 'up' ? i - 1 : i + 1;
      if (i < 0 || j < 0 || j >= ctx.items.length) break;
      [ctx.items[i], ctx.items[j]] = [ctx.items[j], ctx.items[i]];
      save(true);
      rerender();
      break;
    }

    case 'del': {
      if (!ctx) break;
      const it = ctx.items.find(x => x.id === btn.dataset.item);
      if (!it) break;
      const ok = await confirmDialog({
        title: '項目を削除', body: it.text ? `「${it.text}」を削除します。` : 'この空の項目を削除します。',
        ok: '削除する', danger: true,
      });
      if (!ok) break;
      ctx.items = ctx.items.filter(x => x.id !== it.id);
      // 過去のチェック記録からも取り除く
      for (const day of Object.values(state.log)) if (day[ctx.id]) delete day[ctx.id][it.id];
      save(true);
      rerender();
      break;
    }

    case 'sound': {
      state.settings.sound = !state.settings.sound;
      save(true);
      if (state.settings.sound) playCheckSound();
      rerender();
      toast(state.settings.sound ? '音を鳴らします' : '音を鳴らしません');
      break;
    }

    case 'style': {
      state.settings.soundStyle = btn.dataset.style === 'pico' ? 'pico' : 'unlock';
      save(true);
      const was = state.settings.sound;
      state.settings.sound = true;
      playCheckSound();
      state.settings.sound = was;
      rerender();
      break;
    }

    case 'remind': {
      state.settings.remind = !state.settings.remind;
      save(true);
      if (state.settings.remind) checkReminders(); else hideAlert();
      rerender();
      toast(state.settings.remind ? '時刻になったら知らせます' : 'リマインダーを止めました');
      break;
    }

    case 'notifyperm': await askNotifyPermission(); break;

    case 'keepawake': {
      state.settings.keepAwake = !state.settings.keepAwake;
      save(true);
      if (state.settings.keepAwake) {
        await acquireWakeLock();
        toast('wakeLock' in navigator ? '画面はスリープしません' : 'この端末は非対応です');
      } else {
        await releaseWakeLock();
        toast('通常どおりスリープします');
      }
      rerender();
      break;
    }

    case 'export': exportJSON(); break;
    case 'import': importJSON(); break;

    case 'wipe': {
      const ok1 = await confirmDialog({
        title: '全データを消去', body: 'チェック項目も履歴もすべて消え、初期状態に戻ります。\n先にJSONへ書き出しておくことを強くおすすめします。',
        ok: '次へ', danger: true,
      });
      if (!ok1) break;
      const ok2 = await confirmDialog({ title: '本当に消しますか？', body: '取り消せません。', ok: '消去する', danger: true });
      if (!ok2) break;
      state = defaultData();
      save(true);
      go('#/'); render();
      toast('初期状態に戻しました');
      break;
    }
  }
});

/* 行はdiv（中にスキップボタンを置くため）なので、Enter / Space を自前で拾う */
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const row = e.target.closest && e.target.closest('.item');
  if (!row) return;
  e.preventDefault();
  row.click();
});

/* 時刻を決め終わったら画面を作り直す（設定の一覧と解除ボタンの表示を合わせる） */
main.addEventListener('change', (e) => {
  const el = e.target.closest('[data-edit="remind"]');
  if (el) { save(true); rerender(); }
});

/* テキスト編集（再描画せずに保存＝入力中にカーソルが飛ばない） */
main.addEventListener('input', (e) => {
  const el = e.target.closest('[data-edit]');
  if (!el) return;
  const ctx = findCtx(el.dataset.ctx);
  if (!ctx) return;
  const it = ctx.items.find(x => x.id === el.dataset.item);
  if (el.dataset.edit === 'ctx') ctx.name = el.value;
  else if (el.dataset.edit === 'remind') {
    if (it) {
      if (el.value) it.remind = el.value; else delete it.remind;
      // 時刻を変えたら、その日の「通知済み」を取り消して出し直せるようにする
      if (state.notified[today]) delete state.notified[today][it.id];
    }
  }
  else if (it) it.text = el.value;
  save();
});

/* =========================================================
   バックアップ（書き出し / 読み込み）
   ========================================================= */
function exportJSON() {
  save(true);
  const now = new Date();
  const name = `checklist-backup-${now.getFullYear()}${pad2(now.getMonth()+1)}${pad2(now.getDate())}-${pad2(now.getHours())}${pad2(now.getMinutes())}.json`;
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast('書き出しました：' + name, 4000);
}

function importJSON() {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'application/json,.json';
  inp.onchange = async () => {
    const file = inp.files && inp.files[0];
    if (!file) return;
    let obj;
    try { obj = JSON.parse(await file.text()); }
    catch (e) { toast('JSONとして読めませんでした'); return; }
    if (!isValidData(obj)) { toast('このアプリのバックアップではないようです'); return; }
    const n = normalize(obj);
    const items = n.contexts.reduce((a, s) => a + s.items.length, 0);
    const ok = await confirmDialog({
      title: '読み込みますか？',
      body: `コンテキスト ${n.contexts.length}件／項目 ${items}件／記録 ${Object.keys(n.log).length}日分\n\n今この端末にあるデータは置き換わります。`,
      ok: '読み込む', danger: true,
    });
    if (!ok) return;
    state = n;
    today = businessDateKey();
    pruneLog();
    save(true);
    go('#/'); render();
    toast('読み込みました');
  };
  inp.click();
}

/* =========================================================
   日付の切り替わり
   ========================================================= */
function checkDayRollover() {
  const k = businessDateKey();
  if (k === today) return false;
  today = k;
  pruneLog();
  save(true);
  hideAlert();
  render();
  toast('日付が変わりました。新しい1日として始めます', 4000);
  return true;
}
setInterval(() => { if (!checkDayRollover()) checkReminders(); }, 20000);

/* =========================================================
   Service Worker（オフライン動作）
   ========================================================= */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  addEventListener('load', async () => {
    try {
      const reg = await navigator.serviceWorker.register('./sw.js');
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', () => {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) {
            const el = $('#toast');
            el.innerHTML = '新しいバージョンがあります<button type="button" id="doUpdate">更新</button>';
            el.classList.add('show');
            clearTimeout(toastTimer);
            $('#doUpdate').onclick = () => {
              navigator.serviceWorker.addEventListener('controllerchange', () => location.reload(), { once: true });
              nw.postMessage('skip-waiting');
            };
          }
        });
      });
    } catch (e) { /* オフライン等。無視 */ }
  });
}

/* =========================================================
   起動
   ========================================================= */
state = load();
today = businessDateKey();
pruneLog();
save(true);
render();
checkReminders();
acquireWakeLock();
})();
</script>
